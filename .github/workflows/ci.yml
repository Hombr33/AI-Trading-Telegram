name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio black ruff mypy
    
    - name: Lint with Black
      run: |
        black --check --diff src/
    
    - name: Lint with Ruff
      run: |
        ruff check src/
    
    - name: Type check with mypy
      run: |
        mypy src/
    
    - name: Run tests with pytest
      run: |
        pytest . --cov=src --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  windows-ea-compile:
    runs-on: windows-latest
    continue-on-error: true  # Don't fail the entire workflow if EA compilation fails
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Check EA files exist
      run: |
        echo "Checking EA source files..."
        if (Test-Path "ea\BridgeEA.mq5") {
          echo "✅ BridgeEA.mq5 found"
        } else {
          echo "❌ BridgeEA.mq5 not found"
        }
        if (Test-Path "ea\BridgeEA.mq4") {
          echo "✅ BridgeEA.mq4 found"
        } else {
          echo "❌ BridgeEA.mq4 not found"
        }
    
    - name: Check MetaTrader installation paths
      run: |
        echo "Checking MetaTrader installation paths..."
        $mt5Paths = @(
          "C:\Program Files\MetaTrader 5\metaeditor64.exe",
          "C:\Program Files (x86)\MetaTrader 5\metaeditor64.exe",
          "$env:LOCALAPPDATA\Programs\MetaTrader 5\metaeditor64.exe"
        )
        $mt4Paths = @(
          "C:\Program Files\MetaTrader 4\metaeditor.exe",
          "C:\Program Files (x86)\MetaTrader 4\metaeditor.exe",
          "$env:LOCALAPPDATA\Programs\MetaTrader 4\metaeditor.exe"
        )
        
        echo "MT5 MetaEditor paths:"
        foreach ($path in $mt5Paths) {
          if (Test-Path $path) {
            echo "✅ Found: $path"
          } else {
            echo "❌ Not found: $path"
          }
        }
        
        echo "MT4 MetaEditor paths:"
        foreach ($path in $mt4Paths) {
          if (Test-Path $path) {
            echo "✅ Found: $path"
          } else {
            echo "❌ Not found: $path"
          }
        }
    
    - name: Attempt MT5 EA compilation
      id: mt5_compile
      run: |
        echo "Attempting MT5 EA compilation..."
        $mt5Editor = $null
        
        # Check multiple possible MT5 installation paths
        $mt5Paths = @(
          "C:\Program Files\MetaTrader 5\metaeditor64.exe",
          "C:\Program Files (x86)\MetaTrader 5\metaeditor64.exe",
          "$env:LOCALAPPDATA\Programs\MetaTrader 5\metaeditor64.exe"
        )
        
        foreach ($path in $mt5Paths) {
          if (Test-Path $path) {
            $mt5Editor = $path
            echo "✅ Using MT5 MetaEditor: $path"
            break
          }
        }
        
        if ($mt5Editor) {
          try {
            echo "Compiling BridgeEA.mq5..."
            & $mt5Editor /compile:ea\BridgeEA.mq5
            if ($LASTEXITCODE -eq 0) {
              echo "✅ MT5 EA compilation successful"
              echo "mt5_status=success" >> $env:GITHUB_OUTPUT
            } else {
              echo "❌ MT5 EA compilation failed with exit code: $LASTEXITCODE"
              echo "mt5_status=failed" >> $env:GITHUB_OUTPUT
            }
          } catch {
            echo "❌ MT5 EA compilation error: $_"
            echo "mt5_status=error" >> $env:GITHUB_OUTPUT
          }
        } else {
          echo "⚠️ MetaTrader 5 not found - skipping compilation"
          echo "mt5_status=skipped" >> $env:GITHUB_OUTPUT
        }
    
    - name: Attempt MT4 EA compilation
      id: mt4_compile
      run: |
        echo "Attempting MT4 EA compilation..."
        $mt4Editor = $null
        
        # Check multiple possible MT4 installation paths
        $mt4Paths = @(
          "C:\Program Files\MetaTrader 4\metaeditor.exe",
          "C:\Program Files (x86)\MetaTrader 4\metaeditor.exe",
          "$env:LOCALAPPDATA\Programs\MetaTrader 4\metaeditor.exe"
        )
        
        foreach ($path in $mt4Paths) {
          if (Test-Path $path) {
            $mt4Editor = $path
            echo "✅ Using MT4 MetaEditor: $path"
            break
          }
        }
        
        if ($mt4Editor) {
          try {
            echo "Compiling BridgeEA.mq4..."
            & $mt4Editor /compile:ea\BridgeEA.mq4
            if ($LASTEXITCODE -eq 0) {
              echo "✅ MT4 EA compilation successful"
              echo "mt4_status=success" >> $env:GITHUB_OUTPUT
            } else {
              echo "❌ MT4 EA compilation failed with exit code: $LASTEXITCODE"
              echo "mt4_status=failed" >> $env:GITHUB_OUTPUT
            }
          } catch {
            echo "❌ MT4 EA compilation error: $_"
            echo "mt4_status=error" >> $env:GITHUB_OUTPUT
          }
        } else {
          echo "⚠️ MetaTrader 4 not found - skipping compilation"
          echo "mt4_status=skipped" >> $env:GITHUB_OUTPUT
        }
    
    - name: Compilation Summary
      run: |
        echo "=== EA Compilation Summary ==="
        echo "MT5 Status: ${{ steps.mt5_compile.outputs.mt5_status }}"
        echo "MT4 Status: ${{ steps.mt4_compile.outputs.mt4_status }}"
        
        if ("${{ steps.mt5_compile.outputs.mt5_status }}" -eq "skipped" -and "${{ steps.mt4_compile.outputs.mt4_status }}" -eq "skipped") {
          echo "⚠️ Both MT4 and MT5 compilation skipped - MetaTrader not found"
          echo "This is expected in CI environment without MetaTrader installed"
        } elseif ("${{ steps.mt5_compile.outputs.mt5_status }}" -eq "success" -or "${{ steps.mt4_compile.outputs.mt4_status }}" -eq "success") {
          echo "✅ At least one EA compiled successfully"
        } else
          echo "❌ EA compilation encountered issues"
        fi

  package:
    needs: [test, windows-ea-compile]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create package
      run: |
        mkdir -p dist
        tar -czf dist/telegram-ai-trade.tar.gz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='tests' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          .
    
    - name: Upload package artifact
      uses: actions/upload-artifact@v3
      with:
        name: telegram-ai-trade-package
        path: dist/

  release:
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download package artifact
      uses: actions/download-artifact@v3
      with:
        name: telegram-ai-trade-package
        path: dist/
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          Automated release from CI/CD pipeline
          
          ## Changes
          - Automated build and test
          - EA compilation verification
          - Package creation
          
          ## Artifacts
          - Source code package
          - Compiled EAs
        draft: false
        prerelease: false
    
    - name: Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/telegram-ai-trade.tar.gz
        asset_name: telegram-ai-trade.tar.gz
        asset_content_type: application/gzip