name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio black ruff mypy
    
    - name: Lint with Black
      run: |
        black --check --diff src/ tests/
    
    - name: Lint with Ruff
      run: |
        ruff check src/ tests/
    
    - name: Type check with mypy
      run: |
        mypy src/
    
    - name: Run tests with pytest
      run: |
        pytest tests/ --cov=src --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  windows-ea-compile:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Compile MT5 EA
      run: |
        echo "Checking if MetaEditor is available..."
        if (Test-Path "C:\Program Files\MetaTrader 5\metaeditor64.exe") {
          echo "MetaEditor found, attempting compilation..."
          "C:\Program Files\MetaTrader 5\metaeditor64.exe" /compile:ea\BridgeEA.mq5
        } else {
          echo "MetaEditor not found, skipping compilation"
        }
    
    - name: Compile MT4 EA
      run: |
        echo "Checking if MetaEditor is available..."
        if (Test-Path "C:\Program Files\MetaTrader 4\metaeditor.exe") {
          echo "MetaEditor found, attempting compilation..."
          "C:\Program Files\MetaTrader 4\metaeditor.exe" /compile:ea\BridgeEA.mq4
        } else {
          echo "MetaEditor not found, skipping compilation"
        }

  package:
    needs: [test, windows-ea-compile]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create package
      run: |
        mkdir -p dist
        tar -czf dist/telegram-ai-trade.tar.gz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='tests' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          .
    
    - name: Upload package artifact
      uses: actions/upload-artifact@v3
      with:
        name: telegram-ai-trade-package
        path: dist/

  release:
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download package artifact
      uses: actions/download-artifact@v3
      with:
        name: telegram-ai-trade-package
        path: dist/
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          Automated release from CI/CD pipeline
          
          ## Changes
          - Automated build and test
          - EA compilation verification
          - Package creation
          
          ## Artifacts
          - Source code package
          - Compiled EAs
        draft: false
        prerelease: false
    
    - name: Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/telegram-ai-trade.tar.gz
        asset_name: telegram-ai-trade.tar.gz
        asset_content_type: application/gzip