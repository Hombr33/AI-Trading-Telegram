# AI Trading Bot Configuration
# This file contains default settings for the trading bot

# Auto Trading Configuration
auto_trading:
  enabled: true
  auto_signal_generation: false  # Disable automatic signal generation
  signal_interval_minutes: 15
  max_trades_per_day: 10
  risk_per_trade_percent: 1.0

# Paper Trading Fallback Configuration
paper_trading:
  enabled: true
  initial_balance: 100000.0  # $100k paper account
  trading_fees: 0.001  # 0.1% default
  use_live_data: true  # Use live market data if available
  data_source: "paper"
  max_leverage: 1.0
  slippage: 0.0001  # 0.01% default slippage
  execution_delay_ms: 100
  auto_trading_mode: true
  realistic_execution: true

# Demo Trading Configuration (backup fallback)
demo_trading:
  enabled: true
  initial_balance: 50000.0
  trading_fees: 0.001
  use_live_data: false
  data_source: "demo"

# Platform Fallback Strategy
platform_fallback:
  enable_paper_trading: true
  enable_demo_trading: true
  auto_fallback: true  # Automatically fall back to paper/demo when real platforms fail
  fallback_priority: ["paper", "demo"]  # Priority order for fallbacks

# Risk Management (Paper Trading)
risk_management:
  max_risk_per_trade_pct: 2.0
  max_daily_drawdown_pct: 6.0
  max_daily_loss_usd: 25.0
  max_open_positions: 10
  consecutive_loss_limit: 4

# Trading Pairs for Auto Trading
trading_pairs:
  forex: ["EURUSD", "GBPUSD", "USDJPY", "AUDUSD", "USDCAD", "USDCHF", "NZDUSD"]
  crypto: ["BTCUSDT", "ETHUSDT", "ADAUSDT", "DOTUSDT", "LINKUSDT", "BNBUSDT"]
  commodities: ["XAUUSD", "XAGUSD", "OILUSD"]
  indices: ["SPX500", "NAS100", "GER30"]

# Notification Settings
notifications:
  telegram_enabled: true
  trade_notifications: true
  risk_alerts: true
  daily_reports: true